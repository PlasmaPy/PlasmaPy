# Create a quarterly pull request to update the minimum allowed versions
# of dependencies, dropping minor versions released more than 24 months
# ago as per the schedule defined in the SPEC 0 community standard.
#
# SPEC 0: https://scientific-python.org/specs/spec-0000

name: Perform SPEC 0 updates

on:
  schedule:
  - cron: 41 0 3 1,4,7,10 *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bump-minimum-versions:
    runs-on: ubuntu-latest
    steps:
    - uses: scientific-python/spec0-action@6d7df2702c1dfc225a7ce5918616db9a6a652901   # v1.4
      with:
        update_all: 2  # use the SPEC 0 drop schedule of 2 years for all packages
